# Continuous Integration for Gradle
# Runs `gradle build` (which also executes tests), then builds, smoke-tests, and uploads
# the :repl:shadowJar artifact. Gradle also generates Build Scan links (see settings.gradle.kts).
#
# References:
# * https://docs.gradle.org/current/userguide/github-actions.html
# * https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle
# * https://github.com/gradle/gradle-build-action

name: Gradle

on: [push, pull_request]

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.1.0
    - name: Set up JDK 25 LTS
      uses: actions/setup-java@v5.7.0
      with:
        distribution: temurin
        java-version: 25
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5.0.2
    - name: Check formatting
      run: ./gradlew spotlessCheck
    - name: Build with Gradle
      run: ./gradlew build
    - name: Verify independent Pets and Solarnet builds
      run: python3 scripts/verify-build-separation.py
    - name: Build REPL jar
      run: ./gradlew :repl:shadowJar
    - name: Smoke-test packaged REPL outside the checkout
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import re
        import subprocess
        import tempfile

        jar = Path("modules/repl/build/libs/repl-all.jar").resolve(strict=True)
        with tempfile.TemporaryDirectory() as directory:
            result = subprocess.run(
                ["java", f"-Duser.home={directory}", "-jar", str(jar)],
                cwd=directory,
                input="newgame B 3\ncount Player\nexit\n",
                text=True,
                stdout=subprocess.PIPE,
                stderr=subprocess.STDOUT,
                timeout=60,
                check=True,
            )
            print(result.stdout)
            output = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", result.stdout)
            lines = [line.rsplit("> ", 1)[-1] for line in output.splitlines()]
            for expected in ("New 3-player game created with options: B", "3 Player", "Bye"):
                assert expected in lines, f"Missing REPL result: {expected}"
            assert "Error:" not in result.stdout, "REPL command failed"
        PY
    - name: Upload REPL jar
      uses: actions/upload-artifact@v6.0.0
      with:
        name: 'repl-all.jar'
        path: 'modules/repl/build/libs/repl-all.jar'
