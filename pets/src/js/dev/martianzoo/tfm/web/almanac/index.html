<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="Cache-Control" content="no-store">
    <title>Pets Almanac</title>
    <link rel="icon" type="image/png" href="favicon.png?v=20261018-3">
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('almanac-theme') || 'light'; } catch (_) {}
    </script>
    <link rel="stylesheet" href="almanac.css?v=20261018-2">
  </head>
  <body>
    <header class="toolbar">
      <span class="brand">Pets Almanac</span>
      <div class="search-wrap">
        <input id="class-search" type="text" role="combobox" aria-autocomplete="list"
               aria-label="Look up by class name" aria-controls="class-suggestions"
               aria-expanded="false" autocomplete="off" spellcheck="false"
               placeholder="ClassNameToSearchFor">
        <div id="class-suggestions" class="suggestions" role="listbox" hidden></div>
      </div>
      <button id="query-examples" type="button" class="text-button">see example queries</button>
      <div class="display-options">
        <label><input id="dark-theme" type="checkbox"> Dark theme</label>
        <span id="class-count" class="class-count"></span>
      </div>
    </header>
    <p class="navigation-tip">Clicking any class name adds a panel to the right (replacing what's there). Things will scroll off the left; close panels to scroll them back on. Thanks to gh/terraforming-mars for the card images. Join the MartianZoo <a href="https://discord.gg/yw3eyKzHN">discord</a>.</p>

    <main id="class-columns" class="columns" tabindex="0" aria-label="Almanac columns"></main>
    <script src="custom-sources.js?v=20261018-1"></script>
    <script src="almanac.js?v=20261018-2"></script>
  </body>
</html>
